logging.config=classpath:log4j2-dev.xml

# In-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Recreate schema on every boot, then run data.sql to seed it
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure Hibernate creates tables before data.sql runs
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# invalidate session cookie after 30 min
server.servlet.session.timeout=30m
