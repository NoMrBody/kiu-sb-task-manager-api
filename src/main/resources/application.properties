# Application metadata bound to AppSettings (@ConfigurationProperties prefix "app.settings").
# these defaults apply to every profile and can be overridden per profile.
spring.profiles.active=dev
app.settings.title=Task Manager API
app.settings.pagination-limit=20
app.settings.contact-email=admin@example.com
app.settings.registration-enabled=true

# invalidate session cookie after 30 min
server.servlet.session.timeout=30m

management.endpoints.web.exposure.include=health,info,metrics

# Actuator /actuator/info payload (distinct from GET /api/info application metadata)
info.app.name=Task Manager API
info.app.description=Spring Boot REST API for managing tasks and users
info.app.version=0.0.1-SNAPSHOT
info.app.contact=${app.settings.contact-email}