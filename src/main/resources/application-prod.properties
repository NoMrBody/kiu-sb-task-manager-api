logging.config=classpath:log4j2-prod.xml

# persistent PostgreSQL database for production
spring.datasource.url=jdbc:postgresql://localhost:5432/week7-lab
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# validate the schema against the entities; never auto-mutate prod data
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# do not run data.sql against the production database
spring.sql.init.mode=never

# invalidate session cookie after 30 min
server.servlet.session.timeout=30m
